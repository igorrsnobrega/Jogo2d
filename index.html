<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protótipo Sobrevivência 2D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-wrap">
      <canvas id="game" width="800" height="600"></canvas>
      <div id="hud">
        <div id="life-bar"><span id="life-fill"></span></div>
        <div id="hud-message"></div>
        <div id="hud-clock"></div>
        <div id="time-controls">
          Tempo:
          <button data-speed="0.5">0.5x</button>
          <button data-speed="1">1x</button>
          <button data-speed="2">2x</button>
          <span class="day-length">
            Dia: <select id="day-length">
              <option value="300">5m</option>
              <option value="600" selected>10m</option>
              <option value="900">15m</option>
            </select>
          </span>
        </div>
      </div>
      <div id="inventory-menu" class="hidden">
        <div class="crafting-header">Inventário</div>
        <div class="inventory-grid" id="inventory-grid"></div>
      </div>
      <div id="crafting-menu" class="hidden">
        <div class="crafting-header">Combinar Elementos</div>
        <div class="crafting-section">
          <div class="crafting-grid" id="crafting-grid"></div>
          <div class="crafting-output">
            <div class="crafting-arrow">→</div>
            <div class="slot" id="crafting-result"></div>
          </div>
        </div>
        <div class="crafting-actions">
          <div id="crafting-requirements"></div>
          <button id="crafting-button">Combinar</button>
        </div>
        <div class="crafting-subtitle">Inventário</div>
        <div class="inventory-grid" id="crafting-inventory"></div>
      </div>
      <div id="footer">
        WASD mover | Espaço coletar | C combinar | I inventário | E ação
        <button id="action-button">Ação</button>
        <span id="action-selected"></span>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
